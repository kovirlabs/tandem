name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Linux system deps (Tauri)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libdbus-1-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test -p core --features evals
      - name: Generated IPC types are up to date
        if: runner.os == 'Linux'
        run: pnpm gen:ipc && git diff --exit-code ui/src/ipc/generated
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  privacy-coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-llvm-cov
      - name: router/privacy.rs needs 100% line coverage
        run: |
          cargo llvm-cov -p core --json --summary-only --output-path cov.json
          python3 - <<'PY'
          import json
          files = json.load(open("cov.json"))["data"][0]["files"]
          f = next(f for f in files if f["filename"].endswith("router/privacy.rs"))
          s = f["summary"]["lines"]
          print(f"privacy.rs lines: {s['covered']}/{s['count']}")
          assert s["covered"] == s["count"], "privacy.rs must be fully covered"
          PY
