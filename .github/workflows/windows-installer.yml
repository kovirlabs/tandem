name: Windows installer

# Builds the Tandem NSIS installer (.exe) on a Windows runner.
# - Run it by hand: Actions → "Windows installer" → Run workflow. The .exe is attached to the run
#   as an artifact named "tandem-windows-installer".
# - Push a tag like v0.1.0 to also create a draft GitHub Release with the installer attached.
# Builds are not code-signed yet, so Windows SmartScreen asks the user to confirm.

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

concurrency:
  group: windows-installer-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: write # only used to create the draft release on tag pushes
    # whisper.cpp's Rust bindings are generated with bindgen; windows-latest ships LLVM/libclang.
    # (Its bundled pre-generated bindings assume 64-bit `long` and fail to compile on Windows.)
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: windows-installer
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build installer
        run: pnpm tauri build --bundles nsis
      - name: Find installer
        id: find
        shell: pwsh
        run: |
          $exe = Get-ChildItem target/release/bundle/nsis -Filter '*-setup.exe' | Select-Object -First 1
          if (-not $exe) { throw "No installer was produced." }
          "path=$($exe.FullName)" >> $env:GITHUB_OUTPUT
          "name=$($exe.Name)" >> $env:GITHUB_OUTPUT
      - uses: actions/upload-artifact@v4
        with:
          name: tandem-windows-installer
          path: ${{ steps.find.outputs.path }}
          if-no-files-found: error
          retention-days: 30
      - name: Draft release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: ${{ steps.find.outputs.path }}
